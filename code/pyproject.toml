[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hqml-transfer-qec"
version = "1.1.0"
description = "Reproducible negative audit of hierarchical QEC rate transfer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["numpy>=1.24,<3", "matplotlib>=3.7,<4"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
transfer-qec-reproduce = "hqml_transfer_qec.experiment:main"
transfer-qec-figures = "hqml_transfer_qec.figures:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hqml_transfer_qec*"]

[tool.setuptools.package-data]
"hqml_transfer_qec" = ["data/source/*", "results/*", "results/figures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
