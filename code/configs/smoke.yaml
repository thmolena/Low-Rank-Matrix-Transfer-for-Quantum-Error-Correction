# Smoke / demo configuration: runs in a few seconds on a laptop CPU.
# Numbers from this config are demo-scale (small distance, few thousand trials)
# -- the reported-scale numbers come from configs/full.yaml.
name: smoke
seed: 0
code: repetition
distance: 5
regimes: [iid, biased, burst, correlated, measurement_error]
p_eval: 0.12
p_grid: [0.03, 0.07, 0.11, 0.15, 0.19]
trials: 1500
train_trials: 1200
abstain_threshold: 0.5
q_meas: 0.05
