[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specops-gnndec"
version = "1.0.0"
description = "Topological graph neural decoder for correlated quantum errors: a learned surface-code decoder benchmarked head-to-head against MWPM and BP+OSD on Stim circuits."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Molena Huynh", email = "molena.huynh@jmp.com" }]
keywords = [
    "quantum-error-correction",
    "surface-code",
    "graph-neural-network",
    "decoder",
    "spectral-truncation-operators",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "matplotlib>=3.4",
    "stim>=1.12",
    "pymatching>=2.0",
    "ldpc>=2.0",
    "torch>=1.12",
]

[project.urls]
Homepage = "https://github.com/molenahuynh/Topological-Graph-for-Decoding-in-QEC"

[project.scripts]
gnndec-reproduce = "surfgnn.reproduce:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
