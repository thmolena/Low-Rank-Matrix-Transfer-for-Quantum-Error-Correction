[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "topoqec"
version = "0.1.0"
description = "Channel-adaptive spectral (transfer-operator) decoding for quantum error correction under structured noise"
readme = { text = "Channel-adaptive spectral decoding for QEC: a transfer-operator decoder on the defect graph that breaks the decoder tie under structured noise, with selective decoding and calibration as first-class metrics.", content-type = "text/plain" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Molena Huynh" }]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "networkx>=3.0",
  "scikit-learn>=1.2", "matplotlib>=3.6", "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
dev = ["pytest>=7.0"]

[project.scripts]
topoqec-reproduce = "topoqec.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
